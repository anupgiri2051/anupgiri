<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Anup Giri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <header class="navbar admin-nav">
        <div class="logo">Admin Control Center</div>
        <a href="index.html" class="btn btn-secondary">View Live Website</a>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Content & Operations Management</h1>
            <p>Upload photos, post vlog videos, review messages, and track tasks.</p>
        </div>

        <div class="admin-grid-2col">
            <!-- Photo Uploader -->
            <div class="admin-card">
                <h2>📷 Upload New Photo</h2>
                <form id="upload-photo-form">
                    <div class="form-group">
                        <label>Photo Title</label>
                        <input type="text" id="photo-title" placeholder="e.g. Mountain View" required>
                    </div>
                    <div class="form-group">
                        <label>Select File</label>
                        <input type="file" id="photo-file" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Photo</button>
                </form>

                <h3 class="sub-heading">Uploaded Photos</h3>
                <div id="admin-photos-list" class="admin-item-grid"></div>
            </div>

            <!-- Vlog Publisher -->
            <div class="admin-card">
                <h2>🎥 Publish New Vlog</h2>
                <form id="publish-vlog-form">
                    <div class="form-group">
                        <label>Vlog Title</label>
                        <input type="text" id="vlog-title" placeholder="e.g. Web Dev Episode 1" required>
                    </div>
                    <div class="form-group">
                        <label>YouTube Link</label>
                        <input type="url" id="vlog-url" placeholder="https://www.youtube.com/watch?v=..." required>
                    </div>
                    <div class="form-group">
                        <label>Short Description</label>
                        <textarea id="vlog-desc" rows="2" placeholder="Brief summary..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Publish Vlog</button>
                </form>

                <h3 class="sub-heading">Published Vlogs</h3>
                <div id="admin-vlogs-list" class="admin-item-grid"></div>
            </div>
        </div>

        <div class="admin-grid-2col">
            <!-- Messages Reader -->
            <div class="admin-card">
                <h2>📬 Received Messages</h2>
                <div id="admin-messages-list" class="list-vertical"></div>
            </div>

            <!-- Tasks Manager -->
            <div class="admin-card">
                <h2>📋 Task Manager</h2>
                <div class="task-input-group">
                    <input type="text" id="new-task-text" placeholder="Add a new task...">
                    <button id="add-task-btn" class="btn btn-primary">Add Task</button>
                </div>
                <ul id="admin-tasks-list" class="task-list"></ul>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
