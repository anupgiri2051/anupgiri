<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Anup Giri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="padding: 2rem; max-width: 900px; margin: 0 auto;">
        <h1>Admin Control Panel</h1>
        <p>Manage contact messages and website tasks.</p>
        <hr style="margin: 1.5rem 0;">

        <!-- Contact Messages Section -->
        <section>
            <h2>Received Messages</h2>
            <div id="messages-list" style="margin-top: 1rem;"></div>
        </section>

        <hr style="margin: 2rem 0;">

        <!-- Task Management Section -->
        <section>
            <h2>Task Manager</h2>
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <input type="text" id="new-task-input" placeholder="New Task Description..." style="flex: 1; padding: 0.5rem;">
                <button id="add-task-btn" class="btn" style="padding: 0.5rem 1rem;">Add Task</button>
            </div>
            <ul id="tasks-list" style="margin-top: 1rem; list-style: none;"></ul>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
