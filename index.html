<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anup Giri | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">Anup Giri</div>
        <nav>
            <a href="#about">About</a>
            <a href="#photos">Photos</a>
            <a href="#vlogs">Vlogs</a>
            <a href="#contact">Contact</a>
            <a href="admin.html" class="admin-link">Admin Dashboard</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="about">
        <h1>Hello, I'm <span>Anup Giri</span></h1>
        <p>Web Developer & Creative Content Creator from Baglung, Nepal.</p>
        <a href="#contact" class="btn btn-primary">Get In Touch</a>
    </section>

    <!-- Photo Gallery Section -->
    <section class="section" id="photos">
        <h2 class="section-title">Photo Gallery</h2>
        <div id="public-photos-grid" class="grid-container">
            <p class="loading-text">Loading latest photo uploads...</p>
        </div>
    </section>

    <!-- Vlog Gallery Section -->
    <section class="section" id="vlogs">
        <h2 class="section-title">Latest Vlogs</h2>
        <div id="public-vlogs-grid" class="grid-container">
            <p class="loading-text">Loading video content...</p>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="section contact-section" id="contact">
        <h2 class="section-title">Send Me a Message</h2>
        <form id="public-contact-form" class="contact-form">
            <div class="form-group">
                <input type="text" id="contact-name" placeholder="Your Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="contact-email" placeholder="Your Email Address" required>
            </div>
            <div class="form-group">
                <textarea id="contact-message" rows="5" placeholder="Your Message..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="send-btn">Send Message</button>
            <p id="form-status" class="status-msg"></p>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Anup Giri. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
